[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lora-rfsr-savaux"
version = "0.1.0"
description = "RF super-resolution frontend and Savaux weak-LoRa decoding experiments"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
dependencies = [
  "numpy==1.26.4",
  "scipy>=1.10",
]

[project.optional-dependencies]
rfsr = [
  "torch>=2.1",
  "matplotlib>=3.7",
  "scienceplots>=2.1",
  "json5>=0.9",
  "tqdm>=4.65",
  "seaborn>=0.13",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["weak_decoder*", "noisy_iq*"]
exclude = ["third_party*", "data*", "docs*"]
